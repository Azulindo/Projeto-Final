<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso de Funcionários — Vem Pro Abate</title>
<meta name="description" content="Login da aplicação de gestão do Vem Pro Abate.">

<!-- As fontes vêm do próprio repositório desde 28/09 (F-68): o plano B
     da apresentação é servir o site do portátil sem internet, e medido
     sem rede as 18 páginas carregavam ZERO fontes. Ver
     `assets/fontes/fontes.css` e `backend/scripts/baixarFontes.js`. -->
<link rel="stylesheet" href="../../assets/fontes/fontes.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login-wrap">
    <div class="login-card">
      <img src="../../assets/logos/logotipo-barra.png" alt="Vem Pro Abate" class="login-logo" onerror="this.style.display='none'">
      <h1>Vem Pro Abate</h1>
      <p class="subtitulo">Acesso de Funcionários</p>

      <form id="formLogin" novalidate>
        <div class="campo" id="campoEmail">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" placeholder="nome@vemproabate.pt">
          <span class="erro-msg">Introduz um email válido.</span>
        </div>

        <div class="campo" id="campoPassword">
          <label for="password">Palavra-passe</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
          <span class="erro-msg">A palavra-passe é obrigatória.</span>
        </div>

        <div id="erroGeral" class="erro-geral hidden" role="alert"></div>
        <!-- Nota neutra enquanto o Render acorda (ver login.js). Nao e
             erro, por isso nao usa a caixa vermelha nem role="alert". -->
        <p id="notaLenta" class="nota-lenta hidden" role="status"></p>

        <button type="submit" class="btn btn-primario btn-entrar" id="btnEntrar">
          <span id="btnEntrarTexto">Entrar</span>
        </button>
      </form>

      <!-- Aqui estavam escritos os três emails E a palavra-passe. Esta
           página está publicada e tem link no rodapé de todas as páginas
           do site ("Área de funcionários"), por isso qualquer visitante
           lia as credenciais da aplicação de gestão sem precisar de
           descobrir nada. Enquanto não havia login isso era inofensivo;
           a partir do B-19 deixa de ser.
           O texto também já estava errado — o backend está ligado. -->
      <p class="nota-demo">
        🔒 Acesso reservado a funcionários.<br>
        O login é <strong>por posto de trabalho</strong> — cozinha, balcão
        ou administração —, não por pessoa: o que decide é que ecrãs
        aquele dispositivo pode abrir.
      </p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt" data-niveis="cozinha balcao administrador">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozinha — Vem Pro Abate</title>
<meta name="description" content="Ecrã da cozinha: rondas a preparar.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/cozinha.css">

<script src="../js/api.js"></script>
<script src="js/auth-guard.js"></script>
</head>
<body data-pagina="cozinha" data-titulo="Cozinha">

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="content-area">
      <header class="content-topbar" id="contentTopbar"></header>

      <main class="content-main" id="conteudoPagina">

        <!-- Barra de estado da ligação -->
        <div class="barra-estado">
          <div class="estado-ligacao">
            <span class="ponto-ligacao" id="pontoLigacao"></span>
            <span id="textoLigacao">A ligar…</span>
          </div>
          <div class="contador" id="contadores">Nada em mãos.</div>
          <button type="button" class="btn btn-secundario btn-atualizar" id="btnAtualizar">↻ Atualizar</button>
        </div>

        <!-- Uma coluna por estado. Construídas por cozinha.js. -->
        <div class="colunas-cozinha" id="colunasCozinha"></div>

        <p class="nota-rodape">
          Cada cartão é <strong>uma ronda</strong> — tudo o que o cliente enviou de uma vez.
          Ao <strong>aceitar</strong>, o stock desce; ao <strong>anular</strong> (✕), volta.
          As rondas saem do ecrã quando são marcadas como entregues.
          Atualiza-se sozinho a cada 10 segundos.
        </p>

      </main>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/cozinha.js"></script>
</body>
</html>
